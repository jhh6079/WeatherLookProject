<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>의류 추천 시스템 - 입력</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script>
        const addressData = {{ address_data | tojson }};
    </script>
    <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
</head>
<body>
<div id="overlay"></div>
<div class="container">

    <!--        &lt;!&ndash; 추천, 랭킹 네비게이션 바 &ndash;&gt; 네비게이션 바 위치 수정-->
    <nav class="navbar">
        <ul class="navbar-menu">
            <li><a href="{{ url_for('main.index') }}">추천</a></li>
            <li>|</li>
            <li><a href="{{ url_for('main.rank') }}">랭킹</a></li>
        </ul>
    </nav>


    <a href="{{ url_for('main.index') }}">
        <img src="/static/images/weatherlook_black.svg" class="logo"/>
    </a>
    <form id="locationForm" action="/result" method="post">
        <button type="button" id="currentLocationButton" onclick="submitWithCurrentLocation()">현위치 조회</button>
        <select id="city" name="city" onchange="updateGu()">
            <option value="">시/도 선택</option>
        </select>
        <select id="gu" name="gu" onchange="updateDong()">
            <option value="">구/군 선택</option>
        </select>
        <select id="dong" name="dong">
            <option value="">읍/면/동 선택</option>
        </select>
        <input type="hidden" name="latitude" id="latitude">
        <input type="hidden" name="longitude" id="longitude">
        <button id="searchButton" type="submit" onclick="handleLoading(event)">조회</button>
    </form>
</div>
</body>
</html>
