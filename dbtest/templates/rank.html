<!DOCTYPE html>
<html lang="ko">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <a href="{{ url_for('main.index') }}">
        <img src="/static/images/weatherlook_black.svg" class="logo-result"/>
    </a>
    <title>랭킹 페이지</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script>
        const addressData = {{ address_data | tojson }};
    </script>
    <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
</head>
<body>
<div id="overlay"></div>
<div class="container">
    <!-- 네비게이션 바 -->
    <nav class="navbar">
        <ul class="navbar-menu">
            <li><a href="{{ url_for('main.index') }}">추천</a></li>
            <li>|</li>
            <li><a href="{{ url_for('main.rank') }}">랭킹</a></li>
        </ul>
    </nav>
    <a href="{{ url_for('main.index') }}">
        <img src="/static/images/weatherlook_black.svg" class="logo-rank"/>
    </a>
    <!-- 랭킹 페이지 내용 -->
    <div class="ranking-content">
        <!-- 성별 카테고리 버튼 -->
        <div class="filter-buttons gender-category">
            <button class="filter-button active" onclick="changeGenderCategory('전체')">전체</button>
            <button class="filter-button" onclick="changeGenderCategory('남자')">남자</button>
            <button class="filter-button" onclick="changeGenderCategory('여자')">여자</button>
        </div>

        <!-- 상위 카테고리 버튼 -->
        <div class="filter-buttons main-category">
            <button class="filter-button active" onclick="changeMainCategory('전체')">전체</button>
            <button class="filter-button" onclick="changeMainCategory('스트릿')">스트릿</button>
            <button class="filter-button" onclick="changeMainCategory('캐주얼')">캐주얼</button>
        </div>

        <!-- 하위 카테고리 버튼 -->
        <div class="filter-buttons sub-category">
            <button class="filter-button" onclick="selectSubCategory('상의')">상의</button>
            <button class="filter-button" onclick="selectSubCategory('바지')">바지</button>
            <button class="search-button" onclick="search()">검색</button>
        </div>

        <script>
            const addressData = {{ address_data | tojson if address_data else "{}" }};
        </script>
        <div id="mainCategoryContainer" class="main-category-container">
            <!-- 동적으로 카테고리별 슬라이더 추가 -->
        </div>
        <!-- 검색 버튼 아래에 요약 결과 컨테이너 추가 -->
        <div id="summaryContainer" class="summary-container"></div>
        <!--스냅샷 컨테이너 -->
        <div class="snapshot-container">
            <button class="scroll-button left" onclick="scrollSnapshot(-1)">&#9664;</button>
            <div class="snapshot-slider">
                <div class="snapshot-images" id="snapshotImages">
                    <!-- JSON 파일에서 동적으로 이미지 추가 -->
                </div>
            </div>
            <button class="scroll-button right" onclick="scrollSnapshot(1)">&#9654;</button>
        </div>
    </div>
</div>

<div class="chat-sidebar" id="chatSidebar">
    <div class="chat-container">
        <div id="chatResponse" class="chat-response"></div>
        <div class="chat-input">
            <input type="text" id="userQuestion" placeholder="궁금한 점을 입력하세요">
            <button onclick="askQuestion()">질문하기</button>
            <button onclick="saveClothing()" id="saveClothingButton">결정하기</button>
        </div>
    </div>
</div>

<button class="open-chat-btn" onclick="toggleChat()"> <i class="fa fa-comments"></i></button>
</body>
</html>
